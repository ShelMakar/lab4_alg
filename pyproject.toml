[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algopack"
version = "0.1.0"
description = "Алгоритмический мини-пакет: сортировки, очередь, генераторы, benchmark"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]
[project.scripts]
algopack = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
